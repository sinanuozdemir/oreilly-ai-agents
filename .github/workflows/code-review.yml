# GitHub Actions Workflow for AI-Powered Code Review
# This workflow uses MCP server in Docker to analyze PRs

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.py'  # Only run on Python file changes

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git diff
      
      # Step 2: Build the MCP server Docker image
      - name: Build MCP server image
        run: |
          docker build -t mcp-code-review .
      
      # Step 3: Run the code review
      - name: Run AI Code Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # Or use other AI provider
        run: |
          # Create a Python script to run the review
          cat > run_review.py << 'SCRIPT'
          import asyncio
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          
          async def run_code_review():
              """Run MCP-based code review."""
              
              # Get changed files first
              result = subprocess.run(
                  ['git', 'diff', '--name-only', 'origin/main', 'HEAD'],
                  capture_output=True,
                  text=True
              )
              changed_files = [f.strip() for f in result.stdout.split('\n') if f.strip().endswith('.py')]
              
              if not changed_files:
                  print("No Python files changed in this PR")
                  return
              
              print(f"Changed Python files: {changed_files}")
              
              # Run Docker with MCP server
              # Mount the repo and run analysis
              docker_cmd = [
                  'docker', 'run', '--rm',
                  '-v', f'{os.getcwd()}:/repo',
                  '-e', 'REPO_PATH=/repo',
                  'mcp-code-review'
              ]
              
              # For now, let's just run basic checks directly
              # (In a full implementation, you'd connect via MCP protocol)
              
              review_results = []
              
              for file_path in changed_files[:5]:  # Limit to first 5 files
                  if not Path(file_path).exists():
                      continue
                  
                  print(f"\n=== Analyzing {file_path} ===")
                  
                  # Run flake8
                  result = subprocess.run(
                      ['flake8', '--max-line-length=100', file_path],
                      capture_output=True,
                      text=True
                  )
                  if result.stdout:
                      review_results.append({
                          'file': file_path,
                          'tool': 'flake8',
                          'issues': result.stdout.strip()
                      })
                  
                  # Run bandit (security)
                  result = subprocess.run(
                      ['bandit', '-f', 'txt', '-q', file_path],
                      capture_output=True,
                      text=True
                  )
                  if result.stdout:
                      review_results.append({
                          'file': file_path,
                          'tool': 'bandit',
                          'issues': result.stdout.strip()
                      })
              
              # Generate summary
              summary = generate_review_summary(review_results, changed_files)
              
              # Post to PR
              post_pr_comment(summary)
          
          def generate_review_summary(results, files_analyzed):
              """Generate a nice summary of the review."""
              
              lines = [
                  "## 🤖 AI Code Review Results",
                  "",
                  f"**Files analyzed:** {len(files_analyzed)}",
                  f"**Issues found:** {len(results)}",
                  "",
                  "---",
                  "",
              ]
              
              if not results:
                  lines.append("✅ **Great job!** No issues found in the changed files.")
              else:
                  lines.append("### 📋 Issues Summary")
                  lines.append("")
                  
                  for item in results[:10]:  # Limit to first 10 issues
                      lines.append(f"**{item['file']}** ({item['tool']}):")
                      lines.append("```")
                      lines.append(item['issues'][:500])  # Limit length
                      lines.append("```")
                      lines.append("")
              
              lines.append("---")
              lines.append("")
              lines.append("*This review was generated automatically by the MCP Code Review Bot*")
              
              return "\n".join(lines)
          
          def post_pr_comment(body):
              """Post comment to the PR."""
              import urllib.request
              import urllib.error
              
              token = os.environ['GITHUB_TOKEN']
              repo = os.environ['REPO']
              pr_number = os.environ['PR_NUMBER']
              
              url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
              
              headers = {
                  'Authorization': f'token {token}',
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
              }
              
              data = json.dumps({'body': body}).encode('utf-8')
              
              req = urllib.request.Request(url, data=data, headers=headers, method='POST')
              
              try:
                  with urllib.request.urlopen(req) as response:
                      print(f"Comment posted successfully: {response.status}")
              except urllib.error.HTTPError as e:
                  print(f"Error posting comment: {e.code} {e.reason}")
                  print(e.read().decode())
          
          if __name__ == '__main__':
              asyncio.run(run_code_review())
          SCRIPT
          
          # Install required tools
          pip install flake8 bandit
          
          # Run the review
          python run_review.py
